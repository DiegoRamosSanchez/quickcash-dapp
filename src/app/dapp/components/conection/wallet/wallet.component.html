<!-- Wallet Modals -->
<div *ngIf="showWalletOptions" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fadeIn">
  <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl w-full max-w-md border border-gray-200 dark:border-gray-700 animate-fadeIn" (click)="$event.stopPropagation()">
    
    <!-- Wallet Options Modal -->
    <div *ngIf="modalState === 'wallet-options'">
      <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Conectar Wallet</h2>
        <button (click)="closeWalletOptions()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <!-- Device info display -->
        <div class="p-3 bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-lg">
          <p class="text-blue-800 dark:text-blue-200 text-sm">
            <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            {{ deviceInfo_display }}
          </p>
        </div>

        <button 
          (click)="selectWalletType('ethereum')"
          [disabled]="!isMetaMaskAvailable"
          class="w-full flex items-center p-4 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
          <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/30 rounded-lg flex items-center justify-center mr-4">
            <span class="text-blue-600 dark:text-blue-400 font-bold">Ξ</span>
          </div>
          <div class="text-left">
            <span class="text-gray-900 dark:text-white font-medium block">Ethereum</span>
            <span *ngIf="!isMetaMaskAvailable" class="text-red-500 text-xs">MetaMask no detectado</span>
            <span *ngIf="isMetaMaskAvailable" class="text-green-500 text-xs">MetaMask disponible</span>
          </div>
        </button>

        <button 
          (click)="selectWalletType('ethereum')"
          [disabled]="!isMetaMaskAvailable"
          class="w-full flex items-center p-4 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
          <div class="w-10 h-10 bg-blue-100 dark:bg-blue-900/30 rounded-lg flex items-center justify-center mr-4">
            <span class="text-blue-600 dark:text-blue-400 font-bold">R</span>
          </div>
          <div class="text-left">
            <span class="text-gray-900 dark:text-white font-medium block">Rainbow</span>
            <span *ngIf="!isMetaMaskAvailable" class="text-red-500 text-xs">MetaMask no detectado</span>
            <span *ngIf="isMetaMaskAvailable" class="text-green-500 text-xs">Disponible</span>
          </div>
        </button>

        <!-- MetaMask Installation Alert -->
        <div *ngIf="!isMetaMaskAvailable" class="p-4 bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-800 rounded-lg">
          <div class="flex items-start space-x-3">
            <svg class="w-5 h-5 text-yellow-600 dark:text-yellow-400 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16c-.77.833.192 2.5 1.732 2.5z"></path>
            </svg>
            <div>
              <h4 class="font-medium text-yellow-800 dark:text-yellow-200 mb-1">MetaMask Requerido</h4>
              <p class="text-yellow-700 dark:text-yellow-300 text-sm mb-3">
                {{ installMessage }}
              </p>
              
              <!-- Mobile install buttons -->
              <div *ngIf="isMobileDevice" class="space-y-2">
                <button 
                  (click)="handleMetaMaskRedirection()"
                  class="w-full px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg text-sm font-medium transition-colors duration-200">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                  </svg>
                  Instalar MetaMask desde la tienda
                </button>
                
                <button 
                  (click)="recheckMetaMaskInstallation()"
                  class="w-full px-4 py-2 border border-yellow-300 dark:border-yellow-600 text-yellow-700 dark:text-yellow-300 rounded-lg text-sm font-medium hover:bg-yellow-100 dark:hover:bg-yellow-900/20 transition-colors duration-200">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                  </svg>
                  Ya instalé MetaMask
                </button>
              </div>
              
              <!-- Desktop install buttons -->
              <div *ngIf="!isMobileDevice" class="space-y-2">
                <button 
                  (click)="handleMetaMaskRedirection()"
                  class="w-full px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg text-sm font-medium transition-colors duration-200">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                  </svg>
                  Instalar extensión MetaMask
                </button>
                
                <button 
                  (click)="recheckMetaMaskInstallation()"
                  class="w-full px-4 py-2 border border-yellow-300 dark:border-yellow-600 text-yellow-700 dark:text-yellow-300 rounded-lg text-sm font-medium hover:bg-yellow-100 dark:hover:bg-yellow-900/20 transition-colors duration-200">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                  </svg>
                  Ya instalé MetaMask
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="text-center py-4">
          <span class="text-gray-500 dark:text-gray-400 text-sm">O continúa sin wallet</span>
        </div>

        <button 
          (click)="continueWithoutWallet()"
          class="w-full py-3 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-200">
          Continuar sin wallet
        </button>
      </div>
    </div>

    <!-- Ethereum Wallets Modal -->
    <div *ngIf="modalState === 'ethereum-wallets'">
      <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
        <button (click)="backToWalletTypes()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Wallets Ethereum</h2>
        <button (click)="closeWalletOptions()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <button 
          (click)="selectWallet('metamask')"
          [disabled]="!isMetaMaskAvailable"
          class="w-full flex items-center p-4 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
          <div class="w-10 h-10 bg-orange-100 dark:bg-orange-900/30 rounded-lg flex items-center justify-center mr-4">
            <span class="text-orange-600 dark:text-orange-400 text-xl font-bold">M</span>
          </div>
          <div class="text-left">
            <span class="text-gray-900 dark:text-white font-medium block">MetaMask</span>
            <span class="text-gray-500 dark:text-gray-400 text-sm">Wallet más popular</span>
          </div>
        </button>

        <!-- MetaMask not available warning -->
        <div *ngIf="!isMetaMaskAvailable" class="p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg">
          <p class="text-red-700 dark:text-red-300 text-sm">
            MetaMask no está instalado. 
            <button (click)="handleMetaMaskRedirection()" class="underline hover:no-underline">
              Hacer clic aquí para instalarlo
            </button>
          </p>
        </div>
      </div>
    </div>

    <!-- MetaMask Connection Modal -->
    <div *ngIf="modalState === 'connecting-metamask'">
      <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
        <button (click)="backToWalletTypes()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Conectando MetaMask</h2>
        <button (click)="closeWalletOptions()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div class="p-6 text-center">
        <div class="w-20 h-20 bg-orange-100 dark:bg-orange-900/30 rounded-full flex items-center justify-center mx-auto mb-6">
          <div *ngIf="isConnecting" class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-500"></div>
          <span *ngIf="!isConnecting" class="text-orange-600 dark:text-orange-400 text-2xl font-bold">M</span>
        </div>

        <div *ngIf="isConnecting">
          <p class="text-gray-600 dark:text-gray-300 mb-6">Conectando con MetaMask...</p>
          <p class="text-sm text-gray-500 dark:text-gray-400">Por favor, confirma la conexión en MetaMask</p>
        </div>

        <div *ngIf="!isConnecting && errorMessage">
          <p class="text-red-500 mb-6">{{ errorMessage }}</p>
        </div>

        <div class="space-y-3 mt-6">
          <button 
            *ngIf="!isConnecting"
            (click)="connectMetaMask()"
            class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-lg transition-colors duration-200">
            Reintentar
          </button>
          <button 
            (click)="continueWithoutWallet()"
            class="w-full py-3 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors duration-200">
            Continuar sin wallet
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
