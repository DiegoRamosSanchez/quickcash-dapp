<!-- Register Modal -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md animate-fadeIn">
  <div class="w-full max-w-md animate-fadeIn dark-bg" (click)="$event.stopPropagation()">
    <div class="bg-gradient-to-br from-slate-900/95 via-slate-800/95 to-slate-900/95 backdrop-blur-xl rounded-2xl p-8 border border-orange-500/20 shadow-2xl shadow-orange-500/10">
      <!-- Close button -->
      <div class="flex justify-end mb-4">
        <button 
          (click)="closeModal()"
          class="text-slate-400 hover:text-orange-400 transition-colors duration-300 hover:bg-slate-700/30 p-2 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      
      <!-- Logo and Title -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-orange-500 via-orange-600 to-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-orange-500/50">
          <span class="text-white font-bold text-2xl">Q</span>
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">QuickCash</h1>
        <p class="text-slate-400 text-sm">Crea tu cuenta y comienza hoy</p>
      </div>

      <div class="space-y-6">
        
        <!-- Form Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Left Column: Email and Username -->
          <div class="space-y-4">
            <!-- Email Field -->
            <div>
              <label class="block text-sm font-semibold text-slate-200 mb-2">Correo Electrónico</label>
              <div class="relative">
                <input 
                  type="email" 
                  [(ngModel)]="registerData.email"
                  (keypress)="onKeyPress($event)"
                  placeholder="correo@ejemplo.com"
                  class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500/50 transition-all duration-300 hover:border-orange-500/30">
                <span *ngIf="!isValidEmail && registerData.email" class="absolute right-3 top-3.5 text-red-400 text-lg">✕</span>
                <span *ngIf="isValidEmail && registerData.email" class="absolute right-3 top-3.5 text-green-400 text-lg">✓</span>
              </div>
              <p *ngIf="!isValidEmail && registerData.email" class="text-red-400 text-xs mt-1">Ingrese un correo válido</p>
            </div>

            <!-- Username Field -->
            <div>
              <label class="block text-sm font-semibold text-slate-200 mb-2">Nombre de Usuario</label>
              <div class="relative">
                <input 
                  type="text" 
                  [(ngModel)]="registerData.username"
                  (keypress)="onKeyPress($event)"
                  placeholder="Ingrese un nombre de usuario"
                  class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500/50 transition-all duration-300 hover:border-orange-500/30">
                <span *ngIf="!isValidUsername && registerData.username" class="absolute right-3 top-3.5 text-red-400 text-lg">✕</span>
                <span *ngIf="isValidUsername && registerData.username" class="absolute right-3 top-3.5 text-green-400 text-lg">✓</span>
              </div>
              <p *ngIf="!isValidUsername && registerData.username" class="text-red-400 text-xs mt-1">Mínimo 3 caracteres</p>
            </div>
          </div>

          <!-- Right Column: Passwords -->
          <div class="space-y-4">
            <!-- Password Field -->
            <div>
              <label class="block text-sm font-semibold text-slate-200 mb-2">Contraseña</label>
              <div class="relative">
                <input 
                  type="password" 
                  [(ngModel)]="registerData.password"
                  (keypress)="onKeyPress($event)"
                  placeholder="Ingrese una contraseña segura"
                  class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500/50 transition-all duration-300 hover:border-orange-500/30">
                <span *ngIf="!isValidPassword && registerData.password" class="absolute right-3 top-3.5 text-red-400 text-lg">✕</span>
                <span *ngIf="isValidPassword && registerData.password" class="absolute right-3 top-3.5 text-green-400 text-lg">✓</span>
              </div>
              <p *ngIf="!isValidPassword && registerData.password" class="text-red-400 text-xs mt-1">Mínimo 6 caracteres</p>
            </div>

            <!-- Confirm Password Field -->
            <div>
              <label class="block text-sm font-semibold text-slate-200 mb-2">Confirmar Contraseña</label>
              <div class="relative">
                <input 
                  type="password" 
                  [(ngModel)]="registerData.confirmPassword"
                  (keypress)="onKeyPress($event)"
                  placeholder="Confirme su contraseña"
                  class="w-full px-4 py-3 bg-slate-800/50 border border-slate-700/50 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500/50 transition-all duration-300 hover:border-orange-500/30">
                <span *ngIf="!isValidPasswordConfirmation && registerData.confirmPassword" class="absolute right-3 top-3.5 text-red-400 text-lg">✕</span>
                <span *ngIf="isValidPasswordConfirmation && registerData.confirmPassword" class="absolute right-3 top-3.5 text-green-400 text-lg">✓</span>
              </div>
              <p *ngIf="!isValidPasswordConfirmation && registerData.confirmPassword" class="text-red-400 text-xs mt-1">Las contraseñas no coinciden</p>
            </div>
          </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="registerErrorMessage" class="p-4 bg-red-500/15 border border-red-500/40 rounded-lg backdrop-blur-sm">
          <p class="text-red-300 text-sm font-medium">{{ registerErrorMessage }}</p>
        </div>

        <!-- Success Message -->
        <div *ngIf="registerSuccessMessage" class="p-4 bg-green-500/15 border border-green-500/40 rounded-lg backdrop-blur-sm">
          <p class="text-green-300 text-sm font-medium">{{ registerSuccessMessage }}</p>
        </div>

        <!-- Register Button -->
        <button 
          (click)="register()"
          [disabled]="!isFormValid || isLoading"
          class="w-full py-3 bg-gradient-to-r from-orange-500 to-red-600 text-white font-semibold rounded-lg hover:from-orange-600 hover:to-red-700 disabled:from-slate-600 disabled:to-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg shadow-orange-500/30 disabled:shadow-none">
          <span *ngIf="!isLoading">Crear Cuenta</span>
          <span *ngIf="isLoading" class="flex items-center justify-center">
            <svg class="animate-spin h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Creando...
          </span>
        </button>

        <!-- Switch to Login -->
        <div class="pt-2 border-t border-slate-700/50">
          <p class="text-slate-400 text-sm text-center">
            ¿Ya tienes cuenta? 
            <button 
              (click)="onSwitchToLogin()"
              class="text-orange-400 hover:text-orange-300 font-semibold transition-colors duration-300 ml-1">
              Inicia sesión aquí
            </button>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
