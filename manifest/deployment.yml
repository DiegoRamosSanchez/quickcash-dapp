apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickcashv2-deployment
  namespace: diego
  labels:
    app: quickcashv2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quickcashv2
  template:
    metadata:
      labels:
        app: quickcashv2
    spec:
      containers:
        - name: quickcashv2
          image: diegoramos678/quickcashv2:latest
          ports:
            - containerPort: 80  # Cambiado a 80 para Nginx
---
apiVersion: v1
kind: Service
metadata:
  name: quickcashv2-service
  namespace: diego
spec:
  type: NodePort
  ports:
    - port: 80          # Cambiado a 80 para que coincida con el contenedor
      targetPort: 80    # Cambiado a 80 para que coincida con el contenedor
      nodePort: 30000   # Puedes mantener este puerto
  selector:
    app: quickcashv2
